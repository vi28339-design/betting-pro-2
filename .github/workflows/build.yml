name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk

      - name: Install Briefcase
        run: |
          pip install briefcase

      # ✅ СОЗДАЕМ КЛЮЧ ПОДПИСИ (Keystore)
      - name: Generate Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/upload-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upload-key -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      # ✅ СОБИРАЕМ APK (Briefcase сам подпишет его, если найдет ключ)
      - name: Build Android APK
        run: |
          briefcase create android
          briefcase build android

      # ✅ ЗАГРУЖАЕМ APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: betting-pro-apk
          # Путь к APK, который создает Briefcase
          path: build/betting_pro/android/gradle/app/build/outputs/apk/debug/app-debug.apk
